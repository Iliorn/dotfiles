# udiskie: mounts SD cards and USB drives as they are inserted (under
# /run/media/$USER/<label>), started by Hyprland's autostart. Installed and
# stowed on every laptop by the ansible repo (2026-11-01).
#
# event_hook runs on every device event; sd-detect.sh does nothing unless a
# camera card (a DCIM folder) was just mounted, and then opens the import
# window at once (Mark's choice: no notification to click first).
program_options:
  automount: true
  tray: false
  notify: false
  # udiskie runs this without a shell (shlex.split, then each word filled
  # in): "~" was never expanded and the hook silently never ran (first real
  # card, 2026-11-02). sh gives $HOME; the placeholders stay one word each,
  # so a mount path with spaces is still one argument.
  event_hook: "sh -c 'exec \"$HOME/.config/hypr/scripts/sd-detect.sh\" \"$1\" \"$2\"' sd-detect {event} {mount_path}"
