"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$lua$cmd_duration
$character"""

# No palette: the styles below are ANSI names, so the prompt takes the
# terminal's colours and follows theme.sh through alacritty's theme.toml.
[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'

# Language modules appear only inside a matching project.
[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
