general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/desktopwallpaper-1.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(ECEFF4ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(D8DEE9ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 70
    halign = center
    valign = center
}

# Prompt header
label {
    monitor =
    text = -- TERMINAL LOCKED --
    color = rgba(6B7688ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 10
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 340, 44
    outline_thickness = 2
    outer_color = rgba(4C566Aff)
    inner_color = rgba(3B4252ff)
    font_color = rgba(ECEFF4ff)
    font_family = JetBrainsMono Nerd Font Mono
    rounding = 8
    dots_size = 0.4
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    placeholder_text = <span foreground="##6B7688">passwd: _</span>
    fade_on_empty = false
    check_color = rgba(88C0D0ff)
    fail_color = rgba(BF616Aff)
    fail_text = ACCESS DENIED
    position = 0, -40
    halign = center
    valign = center
}
