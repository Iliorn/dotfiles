###################
### HOST-LOCAL  ###
###################
# Two files, and the order matters.
#
# host.conf is this machine's taste: where the external screen stands relative
# to the laptop. Gitignored, one per machine, seeded from host.example.conf.
#
# state/screens.conf is this machine's FACTS: which screens exist right now,
# which workspaces belong to which, and whether the lid is shut. It is
# generated by scripts/screens.sh and sourced LAST, at the bottom of this
# file, so it wins over anything above it and survives `hyprctl reload`.
#
# Hyprland resolves `source =` relative to this config file; ~ is NOT expanded.
source = ./host.conf

###################
### MY PROGRAMS ###
###################
# Disse bruges til dine keybindings (små bogstaver)
$terminal = alacritty
$editor = helix
$fileManager = alacritty -e spf
$menu = rofi -show drun
# Zen er pakken zen-browser-bin fra AUR (se group_vars/laptops.yml i
# Ansible-repoet), så den startes som et almindeligt kommandonavn.
$browser = zen-browser

#################
### AUTOSTART ###
#################
exec-once = waybar
exec-once = awww-daemon
exec-once = sleep 1 && waypaper --restore
exec-once = dunst
exec-once = hypridle
# Clipboard history: one watcher per content type, both feeding cliphist.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# On-screen display for the volume and brightness keys below.
exec-once = swayosd-server
# Adwaita is an XCursor theme, so force Hyprland to select it explicitly.
# This prevents an installed Hyprcursor theme from becoming the fallback.
exec-once = hyprctl setcursor Adwaita 24
# rclone mounts are handled by systemd user services (rclone-dropbox.service,
# rclone-onedrive.service) — see the systemd/ stow package.
# SeaDrive (Seafile virtual drive) is a GUI tray app, so it autostarts here
# rather than as a systemd user service: it needs the graphical session and
# waybar's tray. It holds the FUSE mount at ~/SeaDrive for as long as it runs.
exec-once = seadrive-gui
# Work out the screens before anything else opens a window, and keep watching
# for a cable. screens.sh also picks the workspace to start on: the external
# when docked, the panel when alone.
exec-once = ~/.config/hypr/scripts/screens.sh startup
exec-once = ~/.config/hypr/scripts/screens-watch.py

#############################
### ENVIRONMENT VARIABLES ###
#############################
# Shared editor setting for terminal tools.
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = EDITOR,helix

#####################
### LOOK AND FEEL ###
#####################
general {
    layout = dwindle
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(88c0d0ee) rgba(81a1c1ee) 45deg
    col.inactive_border = rgba(4c566aaa)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(2e3440aa)
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = yes
    bezier = easeOut, 0.0, 0.9, 0.1, 1.0
    # y1 above 1 overshoots the target slightly before settling.
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 6, overshoot, popin 85%
    animation = windowsIn, 1, 3, easeOut, slide
    animation = windowsOut, 1, 3, easeOut, slide
    animation = workspaces, 1, 6, easeOut, slide
    animation = specialWorkspace, 1, 4, easeOut, slidevert
    animation = layers, 1, 4, easeOut, fade
}

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule = match:class ^(Alacritty)$, opacity 0.9 0.8
windowrule = match:title ^(capture)$, float on
windowrule = match:title ^(capture)$, size 600 80
windowrule = match:title ^(capture)$, center 1
# The launcher should appear, not arrive. windowsIn above slides every new
# window in, and on rofi that reads as a GUI animation on something that is
# meant to feel like a terminal prompt.
windowrule = match:class ^([Rr]ofi)$, no_anim on

windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nm-applet)$, float on
windowrule = suppress_event maximize, match:class .*
dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 2
}

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = dk
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0.3
    accel_profile = flat
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Resize windows with Super + Shift + HJKL
binde = SUPER SHIFT, h, resizeactive, -20 0
binde = SUPER SHIFT, l, resizeactive, 20 0
binde = SUPER SHIFT, k, resizeactive, 0 -20
binde = SUPER SHIFT, j, resizeactive, 0 20

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER 

# System binds
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, W, exec, $browser
bind = $mainMod, T, exec, alacritty -e tjek
# super+SHIFT+M is exit, plain super+M was free.
bind = $mainMod, M, exec, alacritty -e ncspot
# SHIFT on purpose: on a 65% board (the CK65) Escape is the key left of 1,
# so a plain super+Escape was one slip away from super+1 and suspended
# x220-2 mid-work (2026-10-25). caps:escape makes Caps Lock count too.
bind = $mainMod SHIFT, Escape, exec, hyprlock & systemctl suspend

# Fokus (HJKL)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Fokus (piletaster)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Skift Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = SUPER, S, togglespecialworkspace,
bind = SUPER SHIFT, S, movetoworkspace, special

# Multimedia taster
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Lid
# Closing the lid hands the session to an external screen instead of
# stranding workspaces on a panel nobody can see. Does nothing when the
# laptop is alone, so logind still suspends as usual. See scripts/lid.sh.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open

# Mus integration
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Obsidian quick capture
bind = $mainMod SHIFT, N, exec, alacritty --title capture -e fish ~/.config/hypr/obsidian-capture.fish

# Andet
Unbind = mouse:274
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
# Annotate: the shot opens in satty, which saves to ~/Pictures and copies.
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png --early-exit --copy-command wl-copy

# Clipboard history and colour picker
bind = $mainMod SHIFT, V, exec, ~/.config/hypr/scripts/clipmenu.sh
bind = $mainMod SHIFT, C, exec, hyprpicker -a

###################
### SCREEN FACTS ##
###################
# LAST on purpose. Generated by scripts/screens.sh from what is actually
# plugged in and whether the lid is shut, so a reload can no longer resurrect
# a panel behind a closed lid or strand the workspaces that belong on it.
# Never edit by hand; it is rewritten on every screen change.
source = ./state/screens.conf
