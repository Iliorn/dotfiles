general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/dispatch.sh 'hl.dsp.dpms({ action = "on" })' dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = ~/.config/hypr/scripts/dispatch.sh 'hl.dsp.dpms({ action = "off" })' dpms off
    on-resume = ~/.config/hypr/scripts/dispatch.sh 'hl.dsp.dpms({ action = "on" })' dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
