# Host-local Hyprland config (monitor layout + workspace pinning).
#
# Copy to host.conf on each machine (install.sh does this automatically the
# first time). host.conf is gitignored — never commit it.
#
# Default is a single built-in laptop panel. If a machine has additional
# monitors, add their `monitor =` lines and any workspace pinning here in the
# local host.conf — keep multi-monitor specifics out of the shared config.

################
### MONITORS ###
################
monitor = eDP-1, preferred, auto, 1
monitor = , highres, auto, 1
