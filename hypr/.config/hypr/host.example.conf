# Host-local Hyprland config (monitor layout + workspace pinning).
#
# Copy to host.conf on each machine (install.sh does this automatically the
# first time). host.conf is gitignored — never commit it.
#
# Default is a single built-in laptop panel. If a machine has additional
# monitors, add their `monitor =` lines and any workspace pinning here in the
# local host.conf — keep multi-monitor specifics out of the shared config.

################
### MONITORS ###
################
monitor = eDP-1, preferred, auto, 1
monitor = , highres, auto, 1

##################
### WORKSPACES ###
##################
# Pin the workspaces that belong on the laptop panel. This is what makes
# the lid handover reversible: scripts/lid.sh disables the panel when the
# lid shuts, Hyprland moves the pinned workspaces to the external screen,
# and brings them home when the lid opens again. Without pinning they
# would migrate once and stay there.
#
# Name the panel as the machine reports it — `hyprctl monitors all` shows
# eDP-1 on newer laptops, LVDS-1 on the Sandy Bridge X220s.
#
# workspace = 1, monitor:eDP-1, default:true
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
