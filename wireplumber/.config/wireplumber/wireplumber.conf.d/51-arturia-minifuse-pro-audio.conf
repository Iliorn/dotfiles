# Arturia MiniFuse 2 — force the Pro Audio profile.
#
# By default WirePlumber applies an ALSA UCM profile to this interface
# ("HiFi (Line1, Line2, Mic1)"), which splits the card into separate logical
# devices joined by loopback filters. Room EQ Wizard does not go through
# PipeWire — it opens raw ALSA hw: devices via its own csjsound provider — and
# the UCM-split card fails that probe, so the interface never shows up in REW's
# device list.
#
# Disabling UCM leaves the plain ALSA profiles, and pro-audio exposes the raw
# 4-channel device (FL FR FC LFE, S32_LE) that REW expects.
#
# Matched by regex rather than the exact card name so it survives a different
# USB port or a second machine.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-ARTURIA_MiniFuse.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.profile   = "pro-audio"
      }
    }
  }
]
