# Aktiverer PipeWires RAOP-afsender (AirPlay), saa netvaerkshoejttalere
# dukker op som almindelige sinks — her Bluesound NODE ICON paa
# NODEICON.local. Uden den her findes kun stubben i
# /usr/share/pipewire/pipewire.conf.avail/, som ikke er aktiv.
#
# Kraever pakken pipewire-zeroconf (optional dependency paa pipewire), der
# leverer selve libpipewire-module-raop-discover.so. Modulet bruger mDNS via
# avahi til at finde enhederne.
context.modules = [
    { name = libpipewire-module-raop-discover }
]
